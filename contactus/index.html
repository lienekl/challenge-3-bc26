                    <nav class="navbar navbar-expand-lg navbar-light">
                        <div class="container-fluid">
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"

        </div>

            <div class="row">
                <div class="col-12 mt-5">

                </div>
            </div>
        </div>
        <div class="container">
            <div class="row mb-4">
                <div class="col-8 w-80 mx-auto border-form pb-5">
                    <label for="formControlInput" class="form-label pt-3">Name:</label>
                    <input class="form-control form-control-sm" type="name" placeholder="Name Surname"
                        aria-label=".form-control-sm">
                    <label for="formControlInput" class="form-label pt-3">Phone:</label>
                    <input class="form-control form-control-sm" type="phone" placeholder="071 2222 333"
                        aria-label=".form-control-sm">
                    <label for="formControlInput" class="form-label pt-3">Email:</label>
                    <input class="form-control form-control-sm" type="email" placeholder="name@example.com"
                        aria-label=".form-control-sm">
                    <label for="exampleFormControlTextarea1" class="form-label pt-3">Leave your message:</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        placeholder="Let us know your issue!" rows="3" aria-label="textarea"></textarea><br>
                    <div class="mx-auto">
                        <a href="#"><button type="button" class="btn btn-primary border-0 rounded-5">Submit</button>

                </div>

            </div>
